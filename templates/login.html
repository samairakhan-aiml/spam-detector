<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpamShield-login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
  <div class="app-bg"></div>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon" style="font-size: 34px; display:flex; align-items:center; justify-content:center;">
      📩
    </div>
      <h1 class="brand-name">Spam Shield</h1>
      <p class="brand-sub">Machine Learning Based Spam Detection System</p>
    </div>

    <div class="login-card">
      <div class="login-card-header">
        <h2>Login to Check Emails</h2>
      </div>

      {% if error %}
      <div class="alert-error">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/" class="login-form">
        <div class="field-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </div>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <button type="submit" class="btn-signin">
          <span>Continue</span>
          <svg viewBox="0 0 24 24" width="18" height="18">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="demo-block">
        <p class="demo-label">Sample Emails</p>
        <div class="demo-pills">
          <button type="button" onclick="fill('student@university.edu')">student@university.edu</button>
          <button type="button" onclick="fill('admin@emailspamdetector.app')">admin@emailspamdetector.app</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fill(email) {
      document.getElementById('email').value = email;
      document.getElementById('email').focus();
    }
  </script>
</body>

</html>
